# Every push and pull request: the mod is validated, tested and type-checked,
# and the board service's tests run. Nothing here needs a login or a secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mod:
    name: Mod (validate, test, type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate plugins/pixel-pets
      - name: Test
        run: claude plugin test plugins/pixel-pets
      - name: Type-check
        # the API types are laid by the engine and never published; type-check only where they are
        working-directory: plugins/pixel-pets
        run: |
          if [ ! -f .claude-plugin/types/tsconfig.json ]; then
            echo "::notice::No engine types here; type-check skipped (run tsc locally)"
            exit 0
          fi
          [ -f tsconfig.json ] || echo '{ "extends": "./.claude-plugin/types/tsconfig.json" }' > tsconfig.json
          npx -y -p typescript tsc -p . --noUnusedLocals

  server:
    name: Board service (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: server
        run: npm test
